[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mattrix-quality"
version = "0.1.0"
description = "Monorepo-wide Python quality-tool configuration"
requires-python = ">=3.11"

[project.optional-dependencies]
quality = [
  "basedpyright>=1.0",
  "PyYAML>=6.0",
  "pytest>=8.0.0",
  "ruff>=0.9.0",
  "types-PyYAML>=6.0",
]

[tool.setuptools]
packages = []

[tool.ruff]
line-length = 80
target-version = "py311"
exclude = [".git", ".pytest_cache", ".ruff_cache", ".venv", "build", "dist", "tmp"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PL"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Tests use literal expected values. Their scenario-oriented control flow does not
# benefit from production-function complexity limits.
"agents/stagger-step/tests/**/*.py" = ["PLR0911", "PLR0912", "PLR0915", "PLR2004"]
# These deterministic command and validation functions have intentionally dense
# control flow. Keep all other Pylint-family checks enabled in these files.
"agents/stagger-step/src/stagger_step/cli.py" = ["PLR0911", "PLR0912", "PLR0915"]
"agents/stagger-step/src/stagger_step/harness.py" = ["PLR0912", "PLR0915"]
"agents/stagger-step/src/stagger_step/normalizer.py" = ["PLR0912"]
"agents/stagger-step/src/stagger_step/render.py" = ["PLR0912"]
"agents/stagger-step/src/stagger_step/state.py" = ["PLR0912", "PLR0915"]
"make.py" = ["PLR0911"]
"skills/src/interface/workspace/scripts/validate_workspace.py" = ["PLR0912"]
"skills/src/map/git-project/scripts/ensure_git_project.py" = ["PLR0912"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
exclude = [".venv", "tmp", "build", "dist", "agents/stagger-step/tests"]
