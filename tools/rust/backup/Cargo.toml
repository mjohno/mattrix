[package]
name = "mattrix-backup"
version = "0.1.0"
edition = "2021"
description = "Local backup utility."
license = "UNLICENSED"
publish = false

[lib]
name = "mattrix_backup"
path = "src/lib.rs"

[[bin]]
name = "mattrix-backup"
path = "src/main.rs"

[dependencies]
google-drive3 = { version = "7.0.0", features = ["yup-oauth2-service-account"] }
yup-oauth2 = "12.1.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "6.0.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
filetime = "0.2"
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
