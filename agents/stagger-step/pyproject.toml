[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stagger-step"
version = "0.1.0"
description = "Deterministic approval-gated STEP loop"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
stagger-step = "stagger_step.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "integration: end-to-end subprocess user-path coverage",
  "live: requires an installed live Pi RPC server",
]
